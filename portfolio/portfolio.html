    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Layout</title>
    <link rel="stylesheet" href="portfoliostyle.css">
</head>

    <div class="draggable" data-info-url="/info/ascii-cards.html" data-site-url="https://codepen.io/ricardodalvarado/pen/VYjrWbY" style="top: 40%; left: 10%; z-index: 2;">
        <img src="s1/S1AS1_Queen.png" alt="This is a Queen Card of Queen Bey.">

    <div class="draggable" data-info-url="/info/bjork-fanpage.html" data-site-url="/portfolio/inujima-scaffold" style="top: 25%; left: 45%; z-index: 3;">
        <div class="image-mockup"></div>

    <div class="draggable" data-info-url="/info/art-web-ring.html" data-site-url="/portfolio/s2/portfolios2as1.html" style="top: 60%; left: 35%; z-index: 4;">
        <div class="image-mockup"></div>
        <span>Art of the Web/Ring</span>
    </div>
    
    <div class="draggable" data-info-url="/info/travel-archive.html" data-site-url="/portfolio/1441-chestnut" style="top: 10%; left: 70%; z-index: 5;">
        <div class="image-mockup"></div>
        <span>Travel Archive</span>
    </div>
    
    <div class="draggable" data-info-url="/portfolio/s2/portfolios2fp.html" data-site-url="https://editor.p5js.org/ricardodalvarado01/sketches/25J9dxFrn" style="top: 50%; left: 65%; z-index: 6;">
        <div class="image-mockup"></div>
        <span>WEIGHT OF THE PRESENT</span>
    </div>

    <div class="draggable" data-info-url="/portfolio/s3/portfolios3as1.html" data-site-url="s3as1\s3as1.html" style="top: 75%; left: 15%; z-index: 7;">
        <div class="image-mockup"></div>
        <span>SUBJECT TO CHANGE</span>
    </div>

    <div class="draggable" data-info-url="/portfolio/s3/portfolios3as2.html" data-site-url="/s3as2/s3as2.html" style="top: 80%; left: 55%; z-index: 8;">
        <div class="image-mockup"></div>
        <span>ROOT & ROAM</span>
    </div>

    <div class="draggable" data-info-url="/info/spaghetti-subway.html" data-site-url="/portfolio/project-9" style="top: 30%; left: 80%; z-index: 9;">
        <div class="image-mockup"></div>
        <span>SPAGHETTI CITY SUBWAY</span>
    </div>

    <div class="draggable" data-info-url="/info/reading-responses.html" data-site-url="/portfolio/reading-responses" style="top: 70%; left: 80%; z-index: 10;">
        <div class="image-mockup"></div>
        <span>READING RESPONSES</span>
    </div>

    <div class="dropzone" id="zone-enter">
        VIEW PROJECT INFO
    </div>
    
    <div class="dropzone" id="zone-portfolio">
        ENTER PROJECT WEBSITE
    </div>
    
</div>

<script>
    const draggables = document.querySelectorAll('.draggable');
    const dropzones = document.querySelectorAll('.dropzone');
    let highestZIndex = 20;

    draggables.forEach(element => {
        let isDragging = false;
        let startX, startY, initialLeft, initialTop;

        element.addEventListener('pointerdown', (e) => {
            isDragging = true;
            element.setPointerCapture(e.pointerId);
            
            // Bring the currently clicked element to the top
            highestZIndex++;
            element.style.zIndex = highestZIndex;

            startX = e.clientX;
            startY = e.clientY;
            
            const rect = element.getBoundingClientRect();
            initialLeft = rect.left;
            initialTop = rect.top;
            
            // Convert % positioning to px for smooth dragging
            element.style.left = `${initialLeft}px`;
            element.style.top = `${initialTop}px`;
        });

        element.addEventListener('pointermove', (e) => {
            if (!isDragging) return;

            const currentX = e.clientX;
            const currentY = e.clientY;
            
            const dx = currentX - startX;
            const dy = currentY - startY;

            element.style.left = `${initialLeft + dx}px`;
            element.style.top = `${initialTop + dy}px`;

            // Check for collisions with drop zones
            checkDropZoneHover(element);
        });

        element.addEventListener('pointerup', (e) => {
            if (!isDragging) return;
            isDragging = false;
            element.releasePointerCapture(e.pointerId);

            // Execute drop logic if released over a zone
            handleDrop(element);
            
            // Reset dropzone hover states
            dropzones.forEach(zone => zone.classList.remove('hovered'));
        });
    });

    function checkDropZoneHover(draggedElement) {
        const dragRect = draggedElement.getBoundingClientRect();
        
        dropzones.forEach(zone => {
            const zoneRect = zone.getBoundingClientRect();
            
            // Basic AABB Collision Detection
            const isColliding = !(
                dragRect.right < zoneRect.left || 
                dragRect.left > zoneRect.right || 
                dragRect.bottom < zoneRect.top || 
                dragRect.top > zoneRect.bottom
            );

            if (isColliding) {
                zone.classList.add('hovered');
            } else {
                zone.classList.remove('hovered');
            }
        });
    }

    function handleDrop(draggedElement) {
        const dragRect = draggedElement.getBoundingClientRect();

        dropzones.forEach(zone => {
            const zoneRect = zone.getBoundingClientRect();
            
            const isColliding = !(
                dragRect.right < zoneRect.left || 
                dragRect.left > zoneRect.right || 
                dragRect.bottom < zoneRect.top || 
                dragRect.top > zoneRect.bottom
            );

            if (isColliding) {
                if (zone.id === 'zone-enter') {
                    // Logic for viewing PROJECT INFO
                    const infoUrl = draggedElement.getAttribute('data-info-url');
                    if (infoUrl) {
                        window.location.href = infoUrl; 
                    }
                } else if (zone.id === 'zone-portfolio') {
                    // Logic for entering PROJECT WEBSITE
                    const siteUrl = draggedElement.getAttribute('data-site-url');
                    if (siteUrl) {
                        window.location.href = siteUrl;
                    }
                }
            }
        });
    }
</script>
</body>
</html>

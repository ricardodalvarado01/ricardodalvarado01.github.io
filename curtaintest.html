<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Code Curtain - Loose Strings</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #f0f0f0;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    // --- YOUR SETTINGS ---
    const gravity = 0.5;
    const friction = 0.99;
    const bounce = 0.8;
    const spacing = 18; 
    const rows = 50; // Increased for a taller curtain
    const cols = 40;

    // --- YOUR TEXT ---
    // Use backticks ( ` ) so you can use standard formatting with enters/line breaks!
    const rawText = `
Tell me who I am
Do I provoke you with my tone of innocence?
Don't ask too many questions
That is my one suggestion
You know I keep it real
I live for the appeal
Knew it from the start
It was the only way to mend my broken heart
Don't ask too many questions
This is my one confession
It never was enough
I always wanted more
I always wanted more
Fame is a gun, and I point it blind
Crash and burn, girl, baby, swallow it dry
You've got a front row seat, and I
I got a taste of the glamorous life
There's no mystery, I'm gonna make it
Gonna go down in history
Don't ask too many questions
God gave me the permission
And when you shame me
It makes me want it more
It makes me want it more, more
Fame is a gun, and I point it blind
Crash and burn, girl, baby, swallow it dry
You've got a front row seat, and I
I got a taste of the glamorous life
Love is a drug that I can't deny
I'm your dream girl, but you're not my type
You've got a front row seat, and I
I got a taste of the glamorous life
Glamorous life
Glamorous life
Glamorous life
I got a taste of the glamorous life
Nothing makes me feel as good
As being loved by you
Nothing makes me feel as good
As being loved by you
Fame is a gun, and I point it blind
Crash and burn, girl, baby, swallow it dry
You've got a front row seat, and I
I got a taste of the glamorous life
Love is a drug that I can't deny
I'm your dream girl, but you're not my type
You've got a front row seat, and I
I got a taste of the glamorous life
I got a taste of the glamorous life
I got a taste of the glamorous life
    `;
    
    // This removes the line breaks so the physics engine doesn't render empty gaps
    const codeString = rawText.replace(/[\r\n]+/g, ' '); 
    
    let particles = [];
    let constraints = [];
    
    // Mouse interaction
    const mouse = { x: -1000, y: -1000, radius: 80 };
    window.addEventListener('mousemove', (e) => {
        mouse.x = e.clientX;
        mouse.y = e.clientY;
    });

    // --- Physics Classes ---

    class Particle {
        constructor(x, y, char, pinned = false) {
            this.x = x;
            this.y = y;
            this.oldX = x;
            this.oldY = y;
            this.char = char;
            this.pinned = pinned;
            this.radius = spacing / 2;
        }

        update() {
            if (this.pinned) return;

            let vx = (this.x - this.oldX) * friction;
            let vy = (this.y - this.oldY) * friction;

            this.oldX = this.x;
            this.oldY = this.y;

            this.x += vx;
            this.y += vy + gravity;

            // Mouse collision
            let dx = this.x - mouse.x;
            let dy = this.y - mouse.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist < mouse.radius) {
                let force = (mouse.radius - dist) / mouse.radius;
                // Increased the push force slightly so independent strings part easier
                let pushX = (dx / dist) * force * 8; 
                let pushY = (dy / dist) * force * 8;
                this.x += pushX;
                this.y += pushY;
            }

            // Boundary constraints
            if (this.x < this.radius) {
                this.x = this.radius;
                this.oldX = this.x + Math.abs(this.oldX - this.x) * bounce;
            } else if (this.x > canvas.width - this.radius) {
                this.x = canvas.width - this.radius;
                this.oldX = this.x - Math.abs(this.oldX - this.x) * bounce;
            }

            if (this.y > canvas.height - this.radius) {
                this.y = canvas.height - this.radius;
                this.oldY = this.y - Math.abs(this.oldY - this.y) * bounce;
            }
        }

        draw() {
            ctx.fillStyle = '#333';
            ctx.font = '14px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(this.char, this.x, this.y);
        }
    }

    class Constraint {
        constructor(p1, p2, length) {
            this.p1 = p1;
            this.p2 = p2;
            this.length = length;
        }

        resolve() {
            let dx = this.p1.x - this.p2.x;
            let dy = this.p1.y - this.p2.y;
            let dist = Math.sqrt(dx * dx + dy * dy);
            
            if (dist === 0) return; 

            let difference = (this.length - dist) / dist;
            let offsetX = dx * difference * 0.5;
            let offsetY = dy * difference * 0.5;

            if (!this.p1.pinned) {
                this.p1.x += offsetX;
                this.p1.y += offsetY;
            }
            if (!this.p2.pinned) {
                this.p2.x -= offsetX;
                this.p2.y -= offsetY;
            }
        }
    }

    // --- Initialization ---
    
    function init() {
        particles = [];
        constraints = [];
        
        const startX = canvas.width / 2 - (cols * spacing) / 2;
        const startY = 50; // Moved start position a bit higher
        let charIndex = 0;

        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                let isPinned = (y === 0);
                let char = codeString[charIndex % codeString.length];
                particles.push(new Particle(startX + x * spacing, startY + y * spacing, char, isPinned));
                charIndex++;
            }
        }

        for (let y = 0; y < rows; y++) {
            for (let x = 0; x < cols; x++) {
                let index = y * cols + x;

                // WE REMOVED THE HORIZONTAL CONNECTIONS HERE
                
                // Keep only the vertical connections (connects to the particle below)
                if (y < rows - 1) {
                    constraints.push(new Constraint(particles[index], particles[index + cols], spacing));
                }
            }
        }
    }

    // --- Animation Loop ---

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let p of particles) p.update();
        
        // Lowered resolution iterations from 5 to 3. 
        // This makes the "strings" slightly more elastic/bouncy.
        for (let i = 0; i < 3; i++) {
            for (let c of constraints) c.resolve();
        }

        for (let p of particles) p.draw();

        requestAnimationFrame(animate);
    }

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        init();
    });

    init();
    animate();
</script>
</body>
</html>
